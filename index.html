<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imersão Reset Total</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/script.js" defer></script>
</head>
<body>

<div class="page">
  <h1>Imersão Reset Total</h1>

  <div class="grid">
    <!-- ============ player ============ -->
    <main class="stage">
      <!-- iframe de incorporação do YouTube.
           enablejsapi=1 permite que o script.js retome de onde o usuário parou.
           IMPORTANTE: se trocar o vídeo, troque o ID aqui E em VIDEO_ID no js/script.js -->
      <iframe id="player"
              src="https://www.youtube.com/embed/lzBobeS34H8?enablejsapi=1&amp;rel=0&amp;modestbranding=1&amp;playsinline=1"
              title="Imersão Life Reset"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen></iframe>

      <div class="badges">
        <span class="badge live" id="badgeLive">
          <svg class="dot" viewBox="0 0 24 24"><path d="M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm4.9-3.1-1.4 1.4a5 5 0 0 1 0 7.4l1.4 1.4a7 7 0 0 0 0-10.2zm-9.8 0a7 7 0 0 0 0 10.2l1.4-1.4a5 5 0 0 1 0-7.4L7.1 6.9zM19.8 4l-1.4 1.4a9 9 0 0 1 0 13.2l1.4 1.4a11 11 0 0 0 0-16zM4.2 4a11 11 0 0 0 0 16l1.4-1.4a9 9 0 0 1 0-13.2L4.2 4z"/></svg>
          Replay
        </span>
      </div>

      <div class="toast" id="toast"></div>

      <div class="drop gone" id="drop">
        <div class="inner">
          <h2>Vídeo indisponível no momento</h2>
          <p>Não foi possível carregar o vídeo. Recarregue a página ou fale com o suporte.</p>
        </div>
      </div>
    </main>

    <!-- ============ lateral ============ -->
    <aside class="side">
      <div class="tabs" role="tablist">
        <button class="tab" id="tabChat" role="tab" aria-selected="true" aria-controls="panelChat">Chat</button>
        <button class="tab" id="tabSup" role="tab" aria-selected="false" aria-controls="panelSup">Suporte</button>
      </div>

      <div class="panel" id="panelChat" role="tabpanel" aria-labelledby="tabChat">
        <div class="msgs" id="msgs"></div>
      </div>

      <div class="panel" id="panelSup" role="tabpanel" aria-labelledby="tabSup" hidden>
        <div class="support">
          <figure class="card">
            <div class="avatar">
              <img id="supPhoto" src="img/Lari.png" alt="Atendimento Life Reset">
              <span class="initials" id="supFallback" aria-hidden="true">LR</span>
            </div>
            <figcaption>
              <h3>Suporte Life Reset</h3>
              <p>Dúvidas sobre o acesso, o conteúdo ou a sua inscrição? Fale com a nossa equipe pelo WhatsApp.</p>
            </figcaption>
            <a class="wa" href="https://wa.link/o7qj3l" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.2-1.8-.9-2.1-1s-.5-.2-.7.1-.8 1-.9 1.2-.3.2-.6.1a8.4 8.4 0 0 1-2.5-1.5 9.3 9.3 0 0 1-1.7-2.1c-.2-.3 0-.5.1-.6l.5-.6a2 2 0 0 0 .3-.5.6.6 0 0 0 0-.5L9 6.7c-.2-.5-.5-.5-.7-.5h-.6a1.1 1.1 0 0 0-.8.4 3.4 3.4 0 0 0-1 2.5 5.8 5.8 0 0 0 1.2 3.1 13.4 13.4 0 0 0 5.2 4.6c.7.3 1.3.5 1.7.6a4.2 4.2 0 0 0 1.9.1 3.1 3.1 0 0 0 2-1.4 2.5 2.5 0 0 0 .2-1.4c-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
              Chamar no WhatsApp
            </a>
          </figure>
        </div>
      </div>

      <div class="note" id="note">Comentários desativados...</div>
    </aside>
  </div>

  <footer>
    <span class="seal">
      <svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5l-9-4zm-1.2 15L7 12.2l1.4-1.4 2.4 2.4 5-5L17.2 9l-6.4 7z"/></svg>
      Site seguro
    </span>
    <span class="seal">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 12a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
      Privacidade protegida
    </span>
  </footer>
</div>

<!-- ============ oferta ao fim do vídeo ============ -->
<div class="modal" id="ofertaModal" hidden>
  <div class="modal-bg" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="Condição especial de aniversário">
    <button class="modal-x" id="ofertaFechar" aria-label="Fechar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
    </button>
    <img class="modal-banner" src="img/BannerReset.png"
         alt="Reset Total — 1 ano Life Reset, condição especial de aniversário, 80% OFF">
    <div class="modal-foot">
      <a class="cta" id="ofertaCta" href="#" target="_blank" rel="noopener noreferrer">
        Clique aqui para garantir a promoção
      </a>
    </div>
  </div>
</div>

</body>
</html>
